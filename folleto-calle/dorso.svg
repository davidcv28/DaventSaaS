  <text x="37.5" y="125" font-family="Segoe UI" font-weight="400" font-size="2.081" fill="#5b5476" text-anchor="start">Con tu email</text>
  <text x="37.5" y="127.4" font-family="Segoe UI" font-weight="400" font-size="2.081" fill="#5b5476" text-anchor="start">y tu celular.</text>
</g>
