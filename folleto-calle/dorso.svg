  <circle cx="72" cy="116.2" r="3" fill="#fde047"/>
  <text x="72" y="117.4" font-family="Segoe UI Black" font-weight="400" font-size="2.681" fill="#1b1740" text-anchor="middle">3</text>
  <text x="69" y="122.4" font-family="Segoe UI" font-weight="700" font-size="2.293" fill="#1b1740" text-anchor="start">Publicá tu web</text>
  <text x="69" y="125" font-family="Segoe UI" font-weight="400" font-size="2.081" fill="#5b5476" text-anchor="start">Compartí el link</text>
  <text x="69" y="127.4" font-family="Segoe UI" font-weight="400" font-size="2.081" fill="#5b5476" text-anchor="start">y empezá a vender.</text>
</g>

