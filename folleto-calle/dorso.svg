    </g>
  </g>
<text x="16.6" y="10.4" font-family="Segoe UI Black" font-weight="400" font-size="3.387" fill="#fff" letter-spacing="0.61" text-anchor="start">DAVENT</text>
<text x="16.6" y="13.4" font-family="Segoe UI" font-weight="700" font-size="1.693" fill="#cfc6ff" letter-spacing="0.237" text-anchor="start">TU NEGOCIO EN INTERNET</text>
<rect x="74" y="6.0" width="25" height="5.8" rx="2.9" fill="none" stroke="#fde047" stroke-width="0.35" opacity="0.9"/>
<text x="86.5" y="9.95" font-family="Segoe UI" font-weight="700" font-size="1.905" fill="#fde047" letter-spacing="0.267" text-anchor="middle">PLANES Y PRECIOS</text>

<!-- TITULO -->
<text x="6" y="25.8" font-family="Segoe UI Black" font-weight="400" font-size="5.292" fill="#1b1740" letter-spacing="-0.159" text-anchor="start">Elegí tu plan.</text>
<text x="6" y="31.2" font-family="Segoe UI Black" font-weight="400" font-size="5.292" fill="#4338ca" letter-spacing="-0.159" text-anchor="start">Sin contratos.</text>
<text x="6" y="35" font-family="Segoe UI" font-weight="400" font-size="2.364" fill="#5b5476" text-anchor="start">Pago mensual en pesos. Cambiás de plan o das de baja cuando quieras.</text>

<!-- PLANES -->
<g>
    <rect x="6" y="38.2" width="93" height="16.4" rx="2.2" fill="#f8f6ff" stroke="#e7e1fb" stroke-width="0.35"/>
    <text x="9" y="44.6" font-family="Segoe UI Black" font-weight="400" font-size="3.175" fill="#1b1740" text-anchor="start">Básico</text>
    
    <text x="9" y="49.1" font-family="Segoe UI" font-weight="400" font-size="2.187" fill="#5b5476" text-anchor="start">Web con catálogo · hasta 100 productos · estadísticas</text>
    <text x="96" y="46.3" font-family="Segoe UI Black" font-weight="400" font-size="3.739" fill="#4338ca" text-anchor="end">$25.000</text>
    <text x="96" y="50.1" font-family="Segoe UI" font-weight="700" font-size="1.976" fill="#7a7295" text-anchor="end">/mes</text>
  </g>
<g>
    <rect x="6" y="56.5" width="93" height="16.4" rx="2.2" fill="url(#topPlan)" />
    <text x="9" y="62.9" font-family="Segoe UI Black" font-weight="400" font-size="3.175" fill="#fff" text-anchor="start">Estándar</text>
    <rect x="24.558" y="60.5" width="16.483" height="3.5" rx="1.75" fill="#fde047"/>
    <text x="32.8" y="62.95" font-family="Segoe UI" font-weight="700" font-size="1.729" fill="#1b1740" letter-spacing="0.138" text-anchor="middle">MÁS ELEGIDO</text>
    <text x="9" y="67.4" font-family="Segoe UI" font-weight="400" font-size="2.187" fill="#dcd5ff" text-anchor="start">+ QR, folletos, mapa y página de servicios</text>
    <text x="96" y="64.6" font-family="Segoe UI Black" font-weight="400" font-size="3.739" fill="#fde047" text-anchor="end">$30.000</text>
    <text x="96" y="68.4" font-family="Segoe UI" font-weight="700" font-size="1.976" fill="#dcd5ff" text-anchor="end">/mes</text>
  </g>
<g>
    <rect x="6" y="74.8" width="93" height="16.4" rx="2.2" fill="#f8f6ff" stroke="#e7e1fb" stroke-width="0.35"/>
    <text x="9" y="81.2" font-family="Segoe UI Black" font-weight="400" font-size="3.175" fill="#1b1740" text-anchor="start">Premium</text>
    
    <text x="9" y="85.7" font-family="Segoe UI" font-weight="400" font-size="2.187" fill="#5b5476" text-anchor="start">+ asistencia en vivo, IA de diseño y sin límites</text>
    <text x="96" y="82.9" font-family="Segoe UI Black" font-weight="400" font-size="3.739" fill="#4338ca" text-anchor="end">$40.000</text>
    <text x="96" y="86.7" font-family="Segoe UI" font-weight="700" font-size="1.976" fill="#7a7295" text-anchor="end">/mes</text>
  </g>

<!-- PRUEBA -->
<rect x="6" y="94.4" width="93" height="12.0" rx="2.2" fill="#f4f1ff" stroke="#c4b5fd" stroke-width="0.35" stroke-dasharray="1.2 0.9"/>
