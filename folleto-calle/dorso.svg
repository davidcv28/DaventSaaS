<text x="16.4" y="100" font-family="Segoe UI" font-weight="700" font-size="2.469" fill="#1b1740" text-anchor="start">¿Primera vez? Probá sin pagar</text>
<text x="16.4" y="103.3" font-family="Segoe UI" font-weight="400" font-size="2.152" fill="#5b5476" text-anchor="start">Al registrarte arrancás con un plan de prueba, sin tarjeta.</text>

<!-- PASOS -->
<text x="6" y="111.7" font-family="Segoe UI" font-weight="700" font-size="1.976" fill="#4338ca" letter-spacing="0.296" text-anchor="start">EMPEZÁ HOY EN 3 PASOS</text>
