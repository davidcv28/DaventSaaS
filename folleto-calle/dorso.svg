<svg xmlns="http://www.w3.org/2000/svg" width="105mm" height="148mm" viewBox="0 0 105 148">
<title>DAVENT · folleto para la calle · dorso</title>
<defs>
  <radialGradient id="band" cx="100" cy="-2" r="120" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset="0.42" stop-color="#6d28d9"/>
    <stop offset="1" stop-color="#4338ca"/>
  </radialGradient>
  <linearGradient id="logoGradF" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
  </linearGradient>
  <linearGradient id="logoGradB" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
  </linearGradient>
  <linearGradient id="yellowBand" x1="6" y1="0" x2="99" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#facc15"/>
  </linearGradient>
  <linearGradient id="topPlan" x1="6" y1="0" x2="99" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <pattern id="dots" width="2.2" height="2.2" patternUnits="userSpaceOnUse">
    <circle cx="0.5" cy="0.5" r="0.27" fill="#fff"/>
  </pattern>
  <clipPath id="clipHead"><rect x="0" y="0" width="105" height="58"/></clipPath>
  <clipPath id="clipPromo"><rect x="6" y="99.2" width="93" height="14.2" rx="2.2"/></clipPath>
  <clipPath id="clipCta"><rect x="0" y="117.4" width="105" height="30.6"/></clipPath>
</defs>
<rect width="105" height="148" fill="#fff"/>

<!-- CABECERA -->
<rect width="105" height="17.6" fill="url(#band)"/>
<g clip-path="url(#clipHeadBack)">
  <rect width="105" height="17.6" fill="url(#dots)" opacity="0.4"/>
  <circle cx="99" cy="-8" r="15" fill="none" stroke="#fff" stroke-width="6" opacity="0.08"/>
</g>
<clipPath id="clipHeadBack"><rect width="105" height="17.6"/></clipPath>
<g>
    <rect x="6" y="4" width="8" height="8" rx="2.08" fill="#fff"/>
    <g transform="translate(6.6 4.6) scale(0.17)">
