# Config de tooling Python. Ruff arranca con un baseline pragmático (pyflakes +
# errores de sintaxis); ir subiendo select a medida que se limpie el código.
[tool.ruff]
target-version = "py311"
extend-exclude = [
    "venv",
    "frontend",
    "*/migrations/*",
    "staticfiles",
    "docker",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-export de símbolos en __init__ es el idiom del proyecto (DDD domains).
"__init__.py" = ["F401"]
