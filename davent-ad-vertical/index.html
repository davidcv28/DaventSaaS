<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>davent — ad vertical</title>
<style>
  html, body { margin: 0; background: #0a0820; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
import { DUR, SHOTS, CAPTIONS, END_T, LOGO_HIT } from './timeline.js';
import { seg, lerp, clamp, ease, glide, spring, stageSize, setupCanvas, rgba, loadImage } from './motion.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

const C = {
  deep: '#0A0820', deep2: '#1A1146', violet: '#3B2A8C',
  accent: '#8B7BFF', accent2: '#5EEAD4', ink: '#FFFFFF', ink2: '#C9C6E8',
};
const SANS = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
const F = (s, w = 400) => `${w} ${s}px ${SANS}`;

const names = [...new Set(SHOTS.map(s => s.img))];
const loaded = await Promise.all(names.map(n => loadImage(`assets/${n}.jpg`)));
const IMG = Object.fromEntries(names.map((n, i) => [n, loaded[i]]));

window.DUR = DUR;
window.READY = true;

/* ---------- fondo ---------- */
function backdrop(t) {
  const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0, C.deep);
  g.addColorStop(0.55, '#120C33');
  g.addColorStop(1, C.deep2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const gx = W * (0.5 + Math.sin(t * 0.24) * 0.18), gy = H * (0.32 + Math.cos(t * 0.19) * 0.1);
  const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, W * 0.95);
  rg.addColorStop(0, rgba(C.violet, 0.55));
  rg.addColorStop(0.55, rgba(C.violet, 0.12));
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- toma: captura real a sangre ---------- */
function drawShot(s, t) {
  const img = IMG[s.img];
  const enter = s.t0 === 0 ? 1 : ease.outCubic(seg(t, s.t0 - 0.42, s.t0));
  if (enter <= 0 || t > s.t1 + 0.02) return;

  const k = seg(t, s.t0, s.t1);
  const zoom = lerp(1.06, 1.005, ease.outCubic(clamp(k * 1.35)));
  const base = W / img.width;
  const dw = img.width * base * zoom;
  const dh = img.height * base * zoom;
  const panY = lerp(s.pan[0], s.pan[1], ease.inOutCubic(k)) * base;
  const dx = (W - dw) / 2;
  const dy = -panY + (1 - enter) * 90 * U;

  ctx.save();
  ctx.globalAlpha = enter;
  ctx.drawImage(img, dx, dy, dw, dh);

  // scrim inferior para el texto
  const sg = ctx.createLinearGradient(0, H * 0.5, 0, H);
  sg.addColorStop(0, 'rgba(9,7,30,0)');
  sg.addColorStop(0.3, 'rgba(9,7,30,0.42)');
  sg.addColorStop(0.52, 'rgba(9,7,30,0.86)');
  sg.addColorStop(0.72, 'rgba(9,7,30,0.95)');
  sg.addColorStop(1, 'rgba(9,7,30,0.99)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);

  // scrim superior tenue
  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.14);
  tg.addColorStop(0, 'rgba(9,7,30,0.55)');
  tg.addColorStop(1, 'rgba(9,7,30,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.14);
  ctx.restore();
}

/* ---------- tipografía ---------- */
function setLS(v) { if ('letterSpacing' in ctx) ctx.letterSpacing = v; }

function kicker(text, t, t0) {
  const k = ease.outCubic(seg(t, t0 + 0.15, t0 + 0.7));
  if (k <= 0) return;
  const ph = 58 * U, py = 1286 * U, px = 80 * U;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = F(27 * U, 700);
  setLS('0.2em');
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(9,7,30,0.72)';
  ctx.beginPath();
  ctx.roundRect(px, py, tw + 118 * U, ph, ph / 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2 * U;
  ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.beginPath();
  ctx.arc(px + 34 * U, py + ph / 2, 8 * U, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, px + 60 * U, py + ph / 2 + 1 * U);
  setLS('0px');
  ctx.restore();
}

function caption(text, t, t0, t1) {
  const inK = ease.outCubic(seg(t, t0, t0 + 0.55));
  const outK = 1 - ease.inCubic(seg(t, t1 - 0.3, t1));
  const a = Math.min(inK, outK);
  if (a <= 0) return;
  const size = 84 * U;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = F(size, 800);
  ctx.fillStyle = C.ink;
  setLS('-0.02em');
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 26 * U;
  ctx.shadowOffsetY = 4 * U;
  const base = 1444 * U + (1 - inK) * 40 * U;
  text.forEach((line, i) => {
    const y = base + i * size * 1.08;
    const lk = ease.outCubic(seg(t, t0 + i * 0.09, t0 + i * 0.09 + 0.62));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y - size * 0.96, W, size * 1.3);
    ctx.clip();
    ctx.globalAlpha = a * (0.2 + 0.8 * lk);
    ctx.fillText(line, 80 * U, y + (1 - lk) * size * 0.5);
    ctx.restore();
  });
  setLS('0px');
  ctx.restore();
}

/* ---------- cromo ---------- */
function chrome(t) {
  const a = 1 - ease.inCubic(seg(t, END_T - 0.1, END_T + 0.35));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  // barra de progreso
  const p = clamp(t / DUR);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(0, 0, W, 5 * U);
  ctx.fillStyle = C.accent;
  ctx.fillRect(0, 0, W * p, 5 * U);
  ctx.restore();
}

/* ---------- placa final ---------- */
function endCard(t) {
  if (t < END_T - 0.15) return;
  const cover = ease.outCubic(seg(t, END_T - 0.15, END_T + 0.45));
  ctx.save();
  ctx.globalAlpha = cover;
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, W * 1.1);
  g.addColorStop(0, '#241A63');
  g.addColorStop(0.6, '#140E38');
  g.addColorStop(1, C.deep);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // halo
  const halo = ctx.createRadialGradient(W * 0.5, 860 * U, 0, W * 0.5, 860 * U, 620 * U);
  halo.addColorStop(0, rgba(C.accent, 0.22 * cover));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // marca
  const hit = seg(t, LOGO_HIT, LOGO_HIT + 0.5);
  const scale = lerp(1.14, 1, ease.outCubic(hit)) * lerp(1, 1.015, clamp((t - LOGO_HIT) / 5));
  ctx.save();
  ctx.globalAlpha = ease.outCubic(hit);
  ctx.translate(W / 2, 812 * U);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.fillStyle = C.ink;
  setLS('0.06em');
  ctx.font = F(150 * U, 800);
  ctx.fillText('DAVENT', 0, 0);
  setLS('0px');
  ctx.restore();

  // tagline
  const tg = ease.outCubic(seg(t, LOGO_HIT + 0.45, LOGO_HIT + 1.0));
  if (tg > 0) {
    ctx.save();
    ctx.globalAlpha = tg;
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink2;
    ctx.font = F(46 * U, 600);
    ctx.fillText('Tu marca, tu web, tus reglas.', W / 2, 924 * U + (1 - tg) * 26 * U);
    ctx.restore();
  }

  // url
  const uk = ease.outCubic(seg(t, LOGO_HIT + 0.85, LOGO_HIT + 1.4));
  if (uk > 0) {
    ctx.save();
    ctx.globalAlpha = uk;
    const pw = 560 * U, ph = 108 * U, px = (W - pw) / 2, py = 1036 * U + (1 - uk) * 26 * U;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2 * U;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, ph / 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = C.ink;
    ctx.font = F(48 * U, 700);
    ctx.textAlign = 'center';
    setLS('0.02em');
    ctx.fillText('davent.com.ar', W / 2, py + ph * 0.66);
    setLS('0px');
    ctx.restore();
  }

  // código promocional
  const pk = ease.outCubic(seg(t, LOGO_HIT + 1.15, LOGO_HIT + 1.7));
  if (pk > 0) {
    ctx.save();
    ctx.globalAlpha = pk;
    const ph = 96 * U, py = 1186 * U + (1 - pk) * 24 * U;
    const parts = [
      { txt: 'CÓDIGO', font: F(26 * U, 700), ls: '0.12em', color: C.ink2 },
      { txt: 'PROMO', font: F(40 * U, 800), ls: '0.16em', color: C.accent },
      { txt: '30 DÍAS PREMIUM', font: F(27 * U, 700), ls: '0.08em', color: C.ink },
    ];
    const gap = 22 * U;
    const widths = parts.map(pt => { ctx.font = pt.font; setLS(pt.ls); return ctx.measureText(pt.txt).width; });
    const inner = widths.reduce((a, w) => a + w, 0) + gap * (parts.length - 1);
    const pw = inner + 84 * U, px = (W - pw) / 2;
    ctx.fillStyle = 'rgba(139,123,255,0.16)';
    ctx.strokeStyle = rgba(C.accent, 0.75);
    ctx.lineWidth = 2 * U;
    ctx.setLineDash([12 * U, 9 * U]);
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 18 * U);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const cy = py + ph / 2;
    let x = W / 2 - inner / 2;
    parts.forEach((pt, i) => {
      ctx.font = pt.font;
      setLS(pt.ls);
      ctx.fillStyle = pt.color;
      ctx.fillText(pt.txt, x, cy + 1 * U);
      x += widths[i] + gap;
    });
    setLS('0px');
    ctx.restore();
  }

  // cta
  const ck = ease.outCubic(seg(t, LOGO_HIT + 1.55, LOGO_HIT + 2.1));
  if (ck > 0) {
    ctx.save();
    ctx.globalAlpha = ck;
    const pw = 640 * U, ph = 128 * U, px = (W - pw) / 2, py = 1338 * U + (1 - ck) * 26 * U;
    const bg = ctx.createLinearGradient(px, py, px + pw, py + ph);
    bg.addColorStop(0, C.accent);
    bg.addColorStop(1, '#6C5CE7');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, ph / 2);
    ctx.fill();
    ctx.fillStyle = '#0B0824';
    ctx.font = F(46 * U, 800);
    ctx.textAlign = 'center';
    setLS('0.04em');
    ctx.fillText('PROBALA GRATIS', W / 2, py + ph * 0.65);
    setLS('0px');
    ctx.restore();
  }

  // pie
  const fk = ease.outCubic(seg(t, LOGO_HIT + 2.0, LOGO_HIT + 2.5));
  if (fk > 0) {
    ctx.save();
    ctx.globalAlpha = fk * 0.75;
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink2;
    setLS('0.22em');
    ctx.font = F(24 * U, 600);
    ctx.fillText('TIENDAS · SERVICIOS · GIMNASIOS · ESTUDIOS', W / 2, 1568 * U);
    setLS('0px');
    ctx.restore();
  }
}

/* ---------- frame ---------- */
window.render = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  backdrop(t);
  for (const s of SHOTS) drawShot(s, t);

  const active = SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
  if (t < END_T) kicker(active.kicker, t, active.t0);
  for (const c of CAPTIONS) caption(c.text, t, c.t0, c.t1);

  chrome(t);
  endCard(t);
};
</script>
</body>
</html>
