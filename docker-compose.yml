# =============================================================================
# DAVENT — stack de producción (VPS Donweb + Docker Compose v2)
#
#   web (nginx)   <- 80/443, único servicio expuesto al host
#     |- SPA Vue (estático) + proxy /api, /admin -> gunicorn
#   api (gunicorn) / celery  <- solo redes internas
#   db (postgres) / redis    <- internal_net: SIN puertos ni salida a internet
#   migrate                  <- job one-shot antes de levantar api/celery
#
# Requisitos: .env en la raíz (ver .env.example) y repo clonado en el VPS.
# =============================================================================
name: davent

# Env derivadas compartidas por los servicios Python: las credenciales viven
# una sola vez en .env (POSTGRES_*/REDIS_PASSWORD) y las URLs se arman acá.
x-api-env: &api-env
  DATABASE_URL:          postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_BROKER_URL:     redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env                       # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    networks: [internal_net]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *logging

  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env                       # REDIS_PASSWORD
    # Auth obligatoria aunque no esté expuesto: defensa en profundidad si otro
    # contenedor del host queda comprometido.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    networks: [internal_net]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *logging

  # ---------------------------------------------------------------------------
  # Job one-shot: corre migraciones con la imagen NUEVA antes de que api/celery
  # levanten (depends_on + service_completed_successfully lo garantiza en cada
  # `compose up`, también en el deploy de CI).
  migrate:
    image: ${API_IMAGE:-ghcr.io/davidcv28/daventsaas-api:latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: .env
    environment: *api-env
    networks: [internal_net]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # ---------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:-ghcr.io/davidcv28/daventsaas-api:latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    # Puertos: ninguno publicado al host. nginx lo alcanza por edge_net.
    networks: [edge_net, internal_net]
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:      {condition: service_healthy}
      redis:   {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s               # gunicorn drena conexiones (graceful_timeout)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1G}
    logging: *logging

  # ---------------------------------------------------------------------------
  celery:
    image: ${API_IMAGE:-ghcr.io/davidcv28/daventsaas-api:latest}
    restart: unless-stopped
    command: ["celery", "-A", "DaventProject", "worker", "-l", "info", "--concurrency", "2"]
    env_file: .env
    environment: *api-env
    networks: [edge_net, internal_net]   # edge_net para egress a MP/R2/SMTP
    depends_on:
      redis:   {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "celery -A DaventProject inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}
    logging: *logging

  # ---------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-ghcr.io/davidcv28/daventsaas-web:latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
        VITE_API_BASE_URL: /api
        # Config pública de Firebase Phone Auth: .env la sobreescribe; si no
        # está, se usan los defaults (los mismos del Dockerfile).
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-AIzaSyAUE2OoFITeDNAsEQxnoGDqfIvj6mfrWJs}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-davent-f089b.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-davent-f089b}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:647641643379:web:adb1f08585ee7270986d06}
        # Login social: públicos por diseño; vacíos = botones ocultos.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}   # envsubst del template de vhost
    ports:
      - "80:80"                            # único servicio expuesto al host
      - "443:443"
    networks: [edge_net]
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./docker/web/templates:/etc/nginx/templates:ro
      - ./docker/web/snippets:/etc/nginx/snippets:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]            # bind 80/443
    read_only: true
    # conf.d como tmpfs: envsubst escribe ahí el vhost renderizado al arrancar
    # (además oculta el default.conf de fábrica de la imagen nginx).
    tmpfs: [/tmp, /var/cache/nginx, /var/run, /etc/nginx/conf.d]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

  # ---------------------------------------------------------------------------
  # Emisión/renovación de certs. El wildcard *.<dominio> EXIGE ACME DNS-01:
  # con la zona DNS en Cloudflare (ver AGENTS.md) usar la imagen dns-cloudflare
  # y un token API en docker/certbot/cloudflare.ini (chmod 600, no commitear).
  #   Emisión única: docker compose --profile certbot run --rm certbot \
  #     certonly --dns-cloudflare --dns-cloudflare-credentials \
  #     /run/secrets/cf.ini -d davent.com -d "*.davent.com" \
  #     -m admin@davent.com --agree-tos --no-eff-email
  #   Renovación (cron en el host): docker compose --profile certbot run --rm \
  #     certbot renew && docker compose exec web nginx -s reload
  certbot:
    image: certbot/dns-cloudflare:latest
    profiles: ["certbot"]
    entrypoint: ["certbot"]
    command: ["renew"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./docker/certbot:/run/secrets:ro
    logging: *logging

networks:
  edge_net:
    driver: bridge
  # Sin ruta a internet ni desde el host: db y redis solo existen acá.
  internal_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  static_data:
  media_data:
  letsencrypt:
  certbot_www:
