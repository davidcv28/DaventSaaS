# Fuente de verdad del versionado de la APK (este archivo SÍ se commitea).
# versionCode: entero que sube SIEMPRE en cada publicación — Android lo usa
#              para detectar updates e impedir instalar una versión vieja.
# versionName: número visible para el usuario ("1.0", "1.1"...).
# Al publicar: subir ambos acá y actualizar APP_APK_VERSION_NAME/CODE/URL
# en el env del server (GET /api/config/ expone el bloque 'app').
versionCode=1
versionName=1.0
