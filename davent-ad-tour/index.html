<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>davent — tour</title>
<style>
  html, body { margin: 0; background: #08061a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
import { DUR, SHOTS, CAPTIONS, END_T } from './timeline.js';
import { seg, lerp, clamp, ease, spring, stageSize, setupCanvas, rgba } from './motion.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

const C = { deep: '#0A0820', deep2: '#1A1146', accent: '#8B7BFF', ink: '#FFFFFF', ink2: '#C9C6E8' };
const SANS = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
const F = (s, w = 400) => `${w} ${s}px ${SANS}`;
const setLS = v => { if ('letterSpacing' in ctx) ctx.letterSpacing = v; };

/* ---------- video de la navegación real ---------- */
const vid = document.createElement('video');
const blob = await (await fetch('assets/tour.mp4')).blob();
vid.src = URL.createObjectURL(blob);
vid.muted = true;
vid.playsInline = true;
vid.preload = 'auto';
document.body.appendChild(vid);
vid.style.display = 'none';
await new Promise(res => { vid.onloadeddata = res; vid.load(); });

async function frameAt(vt) {
  const target = clamp(vt, 0, Math.max(0, vid.duration - 0.06));
  if (Math.abs(vid.currentTime - target) < 0.004) return;
  await new Promise(res => {
    const done = () => { vid.removeEventListener('seeked', done); res(); };
    vid.addEventListener('seeked', done);
    vid.currentTime = target;
  });
}

window.DUR = DUR;
window.READY = true;

const shotAt = t => SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
const videoTime = (s, t) => lerp(s.v0, s.v1, clamp((t - s.t0) / (s.t1 - s.t0)));

/* ---------- barra del navegador ---------- */
function chrome(path, t, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, 0, 0, 400 * U);
  g.addColorStop(0, 'rgba(9,7,30,0.72)');
  g.addColorStop(1, 'rgba(9,7,30,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 400 * U);

  ctx.font = F(27 * U, 600);
  setLS('0.01em');
  const tw = ctx.measureText(path).width;
  const pw = Math.min(W - 110 * U, tw + 150 * U), ph = 64 * U;
  const px = (W - pw) / 2, py = 250 * U;
  ctx.fillStyle = 'rgba(9,7,30,0.88)';
  ctx.strokeStyle = 'rgba(255,255,255,0.24)';
  ctx.lineWidth = 2 * U;
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, ph / 2);
  ctx.fill();
  ctx.stroke();

  const lx = px + 36 * U, ly = py + ph / 2;
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 2.6 * U;
  ctx.beginPath();
  ctx.arc(lx, ly - 5 * U, 6 * U, Math.PI, 0);
  ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.beginPath();
  ctx.roundRect(lx - 8 * U, ly - 5 * U, 16 * U, 13 * U, 3 * U);
  ctx.fill();

  ctx.fillStyle = C.ink;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(path, px + 62 * U, py + ph / 2 + 1 * U);
  setLS('0px');
  ctx.restore();
}

/* ---------- avatar ilustrado ---------- */
function avatar(t, alpha, talking) {
  if (alpha <= 0) return;
  const bob = Math.sin(t * 1.15) * 3 * U;
  const cx = W - 148 * U, cy = H - 246 * U + bob, r = 88 * U;
  ctx.save();
  ctx.globalAlpha = alpha;

  // halo
  const halo = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.7);
  halo.addColorStop(0, rgba(C.accent, 0.28));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  const bg = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  bg.addColorStop(0, '#6C5CE7');
  bg.addColorStop(1, '#3B2A8C');
  ctx.fillStyle = bg;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  // hombros
  ctx.fillStyle = '#12102B';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.92, r * 0.86, r * 0.52, 0, Math.PI, 0);
  ctx.fill();
  // cuello
  ctx.fillStyle = '#E0AE86';
  ctx.fillRect(cx - r * 0.15, cy + r * 0.24, r * 0.3, r * 0.3);
  // cabeza
  ctx.fillStyle = '#F0C39A';
  ctx.beginPath();
  ctx.ellipse(cx, cy - r * 0.06, r * 0.42, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // pelo
  ctx.fillStyle = '#241C3B';
  ctx.beginPath();
  ctx.ellipse(cx, cy - r * 0.34, r * 0.45, r * 0.32, 0, Math.PI, 0);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.4, cy - r * 0.16, r * 0.1, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.4, cy - r * 0.16, r * 0.1, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  // anteojos
  ctx.strokeStyle = '#1B1730';
  ctx.lineWidth = 4 * U;
  ctx.beginPath();
  ctx.roundRect(cx - r * 0.33, cy - r * 0.16, r * 0.26, r * 0.2, 6 * U);
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(cx + r * 0.07, cy - r * 0.16, r * 0.26, r * 0.2, 6 * U);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.07, cy - r * 0.06);
  ctx.lineTo(cx + r * 0.07, cy - r * 0.06);
  ctx.stroke();
  // ojos
  ctx.fillStyle = '#1B1730';
  const blink = (t % 3.4) > 3.28 ? 0.25 : 1;
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.2, cy - r * 0.06, r * 0.045, r * 0.05 * blink, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + r * 0.2, cy - r * 0.06, r * 0.045, r * 0.05 * blink, 0, 0, Math.PI * 2);
  ctx.fill();
  // boca (habla)
  const mouth = talking ? 0.55 + 0.45 * Math.abs(Math.sin(t * 9.5)) : 0.35;
  ctx.strokeStyle = '#8A4B3A';
  ctx.lineWidth = 3.4 * U;
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.14, r * 0.14, 0.15 * Math.PI, Math.PI - 0.15 * Math.PI);
  ctx.stroke();
  ctx.fillStyle = '#8A4B3A';
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.2, r * 0.11, r * 0.075 * mouth, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // anillo
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3 * U;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // barras de voz
  if (talking) {
    for (let i = 0; i < 3; i++) {
      const h = (10 + 16 * Math.abs(Math.sin(t * 8 + i * 1.1))) * U;
      ctx.fillStyle = rgba(C.accent, 0.9);
      ctx.beginPath();
      ctx.roundRect(cx - 34 * U + i * 22 * U, cy + r * 0.62 - h / 2, 9 * U, h, 4 * U);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- texto ---------- */
function kicker(text, t, t0) {
  const k = ease.outCubic(seg(t, t0 + 0.2, t0 + 0.75));
  if (k <= 0) return;
  const ph = 54 * U, py = 1346 * U, px = 70 * U;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = F(25 * U, 700);
  setLS('0.2em');
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(9,7,30,0.72)';
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2 * U;
  ctx.beginPath();
  ctx.roundRect(px, py, tw + 112 * U, ph, ph / 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = C.accent;
  ctx.beginPath();
  ctx.arc(px + 32 * U, py + ph / 2, 7 * U, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = C.ink;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, px + 56 * U, py + ph / 2 + 1 * U);
  setLS('0px');
  ctx.restore();
}

function caption(text, t, t0, t1) {
  const inK = ease.outCubic(seg(t, t0, t0 + 0.5));
  const outK = 1 - ease.inCubic(seg(t, t1 - 0.25, t1));
  const a = Math.min(inK, outK);
  if (a <= 0) return;
  const size = 76 * U;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = F(size, 800);
  ctx.fillStyle = C.ink;
  setLS('-0.02em');
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 24 * U;
  ctx.shadowOffsetY = 3 * U;
  const base = 1520 * U + (1 - inK) * 34 * U;
  text.forEach((line, i) => {
    const y = base + i * size * 1.06;
    const lk = ease.outCubic(seg(t, t0 + i * 0.08, t0 + i * 0.08 + 0.55));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y - size * 0.96, W, size * 1.28);
    ctx.clip();
    ctx.globalAlpha = a * (0.2 + 0.8 * lk);
    ctx.fillText(line, 70 * U, y + (1 - lk) * size * 0.45);
    ctx.restore();
  });
  setLS('0px');
  ctx.restore();
}

/* ---------- placa final ---------- */
function endCard(t) {
  if (t < END_T - 0.1) return;
  const cover = ease.outCubic(seg(t, END_T - 0.1, END_T + 0.5));
  ctx.save();
  ctx.globalAlpha = cover;
  const g = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, W * 1.15);
  g.addColorStop(0, '#241A63');
  g.addColorStop(0.6, '#140E38');
  g.addColorStop(1, C.deep);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const halo = ctx.createRadialGradient(W * 0.5, 800 * U, 0, W * 0.5, 800 * U, 640 * U);
  halo.addColorStop(0, rgba(C.accent, 0.22 * cover));
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  const hit = seg(t, END_T + 0.4, END_T + 0.95);
  ctx.save();
  ctx.globalAlpha = ease.outCubic(hit);
  const sc = lerp(1.12, 1, ease.outCubic(hit));
  ctx.translate(W / 2, 780 * U);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.fillStyle = C.ink;
  setLS('0.06em');
  ctx.font = F(150 * U, 800);
  ctx.fillText('DAVENT', 0, 0);
  setLS('0px');
  ctx.restore();

  const tg = ease.outCubic(seg(t, END_T + 0.85, END_T + 1.4));
  if (tg > 0) {
    ctx.save();
    ctx.globalAlpha = tg;
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink2;
    ctx.font = F(46 * U, 600);
    ctx.fillText('Tu marca, tu web, tus reglas.', W / 2, 892 * U + (1 - tg) * 24 * U);
    ctx.restore();
  }

  const uk = ease.outCubic(seg(t, END_T + 1.25, END_T + 1.8));
  if (uk > 0) {
    ctx.save();
    ctx.globalAlpha = uk;
    const pw = 560 * U, ph = 108 * U, px = (W - pw) / 2, py = 1004 * U + (1 - uk) * 24 * U;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2 * U;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, ph / 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = C.ink;
    ctx.font = F(48 * U, 700);
    ctx.textAlign = 'center';
    ctx.fillText('davent.com.ar', W / 2, py + ph * 0.66);
    ctx.restore();
  }

  const pk = ease.outCubic(seg(t, END_T + 1.55, END_T + 2.1));
  if (pk > 0) {
    ctx.save();
    ctx.globalAlpha = pk;
    const ph = 96 * U, py = 1154 * U + (1 - pk) * 22 * U;
    const parts = [
      { txt: 'CÓDIGO', font: F(26 * U, 700), ls: '0.12em', color: C.ink2 },
      { txt: 'PROMO', font: F(40 * U, 800), ls: '0.16em', color: C.accent },
      { txt: '30 DÍAS PREMIUM', font: F(27 * U, 700), ls: '0.08em', color: C.ink },
    ];
    const gap = 22 * U;
    const widths = parts.map(pt => { ctx.font = pt.font; setLS(pt.ls); return ctx.measureText(pt.txt).width; });
    const inner = widths.reduce((a, w) => a + w, 0) + gap * (parts.length - 1);
    const pw = inner + 84 * U, px = (W - pw) / 2;
    ctx.fillStyle = 'rgba(139,123,255,0.16)';
    ctx.strokeStyle = rgba(C.accent, 0.75);
    ctx.lineWidth = 2 * U;
    ctx.setLineDash([12 * U, 9 * U]);
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, 18 * U);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const cy = py + ph / 2;
    let x = W / 2 - inner / 2;
    parts.forEach((pt, i) => {
      ctx.font = pt.font;
      setLS(pt.ls);
      ctx.fillStyle = pt.color;
      ctx.fillText(pt.txt, x, cy + 1 * U);
      x += widths[i] + gap;
    });
    setLS('0px');
    ctx.restore();
  }

  const ck = ease.outCubic(seg(t, END_T + 1.95, END_T + 2.5));
  if (ck > 0) {
    ctx.save();
    ctx.globalAlpha = ck;
    const pw = 640 * U, ph = 128 * U, px = (W - pw) / 2, py = 1306 * U + (1 - ck) * 24 * U;
    const bg = ctx.createLinearGradient(px, py, px + pw, py + ph);
    bg.addColorStop(0, C.accent);
    bg.addColorStop(1, '#6C5CE7');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, ph / 2);
    ctx.fill();
    ctx.fillStyle = '#0B0824';
    ctx.font = F(46 * U, 800);
    ctx.textAlign = 'center';
    ctx.fillText('PROBALA GRATIS', W / 2, py + ph * 0.65);
    ctx.restore();
  }
}

/* ---------- frame ---------- */
window.render = async t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.deep;
  ctx.fillRect(0, 0, W, H);

  const shot = shotAt(t);
  const before = t < END_T;

  if (before) {
    await frameAt(videoTime(shot, t));
    ctx.drawImage(vid, 0, 0, W, H);

    const sg = ctx.createLinearGradient(0, H * 0.52, 0, H);
    sg.addColorStop(0, 'rgba(9,7,30,0)');
    sg.addColorStop(0.28, 'rgba(9,7,30,0.5)');
    sg.addColorStop(0.52, 'rgba(9,7,30,0.9)');
    sg.addColorStop(0.72, 'rgba(9,7,30,0.96)');
    sg.addColorStop(1, 'rgba(9,7,30,0.99)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, H * 0.52, W, H * 0.48);

    chrome(shot.path, t, 1);
    kicker(shot.kicker, t, shot.t0);
    for (const c of CAPTIONS) caption(c.text, t, c.t0, c.t1);
    avatar(t, 1, true);
  }

  endCard(t);
};
</script>
</body>
</html>
