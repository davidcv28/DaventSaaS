# Igual que proxy_api.conf pero para el vhost :8081 (dominios propios de
# tiendas): el TLS terminó en Caddy, así que X-Forwarded-Proto es siempre
# https — con $scheme (http) Django marcaría la sesión como insegura.
proxy_pass http://davent_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
proxy_read_timeout 60s;
