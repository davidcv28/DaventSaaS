# Cabeceras de seguridad independientes del dominio.
#
# nginx NO hereda los `add_header` del server en un `location` que declara
# los suyos: por eso este bloque se incluye tanto en el server como en cada
# location con add_header propio (/static/, /assets/). Sin el include, esos
# assets salían sin HSTS/nosniff y un index.html pedido directo sin CSP.
#
# La CSP y el COOP quedan en el template porque interpolan ${PLATFORM_DOMAIN}.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
# APIs del navegador que la app no usa, apagadas para cualquier origen.
# cámara/geolocalización/clipboard quedan en (self): el panel usa preview de
# fotos, mapas y "copiar link".
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=(), serial=(), midi=(), hid=(), display-capture=(), magnetometer=(), gyroscope=(), accelerometer=(), clipboard-write=(self), browsing-topics=()" always;
add_header X-Permitted-Cross-Domain-Policies none always;
