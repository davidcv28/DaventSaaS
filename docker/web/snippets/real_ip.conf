# Detrás de Caddy (edge TLS): $remote_addr es la IP del contenedor caddy.
# Las subredes privadas cubren las bridges de Docker; real_ip_recursive toma
# el último X-Forwarded-For no confiable = IP real del cliente. Sin esto el
# rate-limit de /api/token/ y los logs verían siempre la IP de Caddy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
