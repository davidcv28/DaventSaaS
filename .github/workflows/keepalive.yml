# =============================================================================
# DAVENT — Keep-alive del deploy free en Render
#
# El plan free de Render duerme el servicio tras ~15 min sin tráfico: el
# siguiente request paga un cold start de ~1-2 min (el peor "carga lento" que
# ve el usuario). Un ping a /healthz/ cada 10 min lo mantiene despierto —
# ~720 h/mes entra en las 750 h gratuitas del plan.
#
# Los cron de Actions no son exactos (pueden demorar unos minutos): con un
# intervalo de 10 min el servicio queda warm la mayor parte del tiempo.
# Si el servicio migra a un plan pago / VPS, este workflow se puede borrar.
# =============================================================================
name: Keep-alive (Render free)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz/
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://daventsaas.onrender.com/healthz/)
          echo "healthz -> $status"
          [ "$status" = "200" ] || exit 1
