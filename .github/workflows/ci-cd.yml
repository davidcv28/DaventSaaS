# =============================================================================
# DAVENT — CI/CD (GitHub Actions -> GHCR -> VPS Donweb por SSH)
#
#   lint   -> ruff (backend). El SPA no se compila acá: lo compilan las dos
#             imágenes en `build` (compilarlo tres veces era puro costo).
#   test   -> check --deploy + makemigrations --check + test vs Postgres real
#   security -> bandit + pip-audit + npm audit + gitleaks + trivy fs
#   build  -> imágenes api/web -> GHCR + trivy image scan (gated por security)
#   deploy -> SSH al VPS: inyecta secretos de webhook + pull + migrate +
#             `up -d --wait` + healthz externo (sin downtime, sin falsos verdes)
#
# Secrets requeridos (repo Settings > Secrets):
#   SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PRIVATE_KEY  -> acceso al VPS Donweb
#   SSH_HOST_FINGERPRINT  -> host key pineada (ssh-keyscan -p PORT HOST | ssh-keygen -lf -)
#   MP_WEBHOOK_SECRET     -> firma HMAC de los webhooks de Mercado Pago
#   SECRET_MP_KEY         -> access token de Mercado Pago
# Variables (repo Settings > Variables):
#   PLATFORM_DOMAIN  -> dominio raíz (ej. davent.com) para el build de Vite
# En el VPS (una sola vez): git clone del repo en /opt/davent + .env real +
#   `docker login ghcr.io` con un PAT read:packages (imágenes privadas).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # En PRs un push nuevo cancela el run viejo (ahorra minutos). En `main` NO:
  # cancelar el run mata TODOS sus jobs — incluido `deploy` a mitad de camino
  # (entre `docker compose pull` y `up -d`). El `concurrency` del job deploy
  # serializa deploys, pero no protege de la cancelación a nivel de workflow.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# El token solo necesita leer el repo; `build` eleva `packages: write`.
permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/daventsaas-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/daventsaas-web

jobs:

  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ruff (estilo, imports, bugs, modernización y seguridad)
        run: |
          pip install ruff==0.17.3
          ruff check --output-format=github .

      - name: Ruff format (informativo)
        # `ruff format --check` todavía no es gate: formatear todo el repo es
        # un diff masivo aparte. Se corre para medir y no bloquea.
        continue-on-error: true
        run: |
          pip install ruff==0.17.3
          ruff format --check --diff .

  # ---------------------------------------------------------------------------
  test:
    name: Django check + tests contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: davent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d davent_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # W009: con menos de 50 chars Django lo marca en cada `check --deploy`.
      # Sin placeholders conocidos (change-me/django-insecure/ci-only): el
      # guard `check_env` los rechaza aunque sea un dummy de CI.
      SECRET_KEY: 9f4c2b7e1a6d8035c9b2e4f7a1d6c3b8e5f2a9d4c7b1e6f3a8d5c2b9e4f7a1d6
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/davent_test
      # Presencia obligatoria en producción (project.E012): el job no levanta
      # un Redis real, solo valida que la var esté definida.
      REDIS_URL: redis://localhost:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SECRET_MP_KEY: TEST-dummy
      # Dummy de CI (no es un secreto real): sin esto payments.E001 (checks.py,
      # deploy=True) tumba el job y con él toda la cadena build -> deploy.
      # Los tests de firma siguen usando su propio SECRET vía patch.dict.
      MP_WEBHOOK_SECRET: ci-only-webhook-secret-not-real-000000000000
      # Keyring AES-256-GCM de la PII de UserProfile + llave HMAC de las
      # huellas (users.E002/E003, deploy=True). Dummies de CI — el keyring
      # real vive en el Environment de producción. El test que verifica el
      # fallback al SECRET_KEY se aísla con override_settings.
      SECRETS_MASTER_KEYS: ci1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      SECRETS_HASH_KEY: ci-only-hash-key-000000000000000000000000000000
      # check --deploy exige un ADMIN_URL no predecible (users.E001)
      ADMIN_URL: ci-backoffice/
      # OJO: SECURE_SSL_REDIRECT / SESSION_COOKIE_SECURE / CSRF_COOKIE_SECURE
      # NO se bajan acá. `check --deploy` (paso siguiente) corre con los
      # defaults de producción (DEBUG=False) y project.E001-E005 validan que
      # nadie los apague. Solo el paso `Tests` los relaja para el test client.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt coverage==7.6.10

      - name: Checklist de despliegue de Django
        run: python manage.py check --deploy

      - name: Guard de variables de entorno
        run: python manage.py check_env

      - name: Migraciones sin commitear (drift de modelos)
        # `manage.py test` ya aplica TODAS las migraciones sobre la DB de test:
        # un `migrate` acá era el mismo trabajo dos veces. Lo que falta de
        # verdad es detectar un modelo cambiado sin su makemigrations.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        env:
          # El test client de Django habla http plano: con las cookies secure
          # y el redirect activos perdería la sesión y todo request sería un
          # 301. El paso `check --deploy` ya validó la config real de prod.
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
        run: |
          coverage run manage.py test --parallel
          coverage combine
          coverage report --fail-under=50

  # ---------------------------------------------------------------------------
  frontend:
    # El SPA solo se compilaba dentro de las imágenes: un error de import o de
    # template Vue recién aparecía en `build` (y en main, después del merge).
    # Acá se compila y se corre el contrato del Studio antes de construir.
    name: SPA (npm ci + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias (lockfile estricto)
        run: npm ci --no-audit --no-fund

      - name: ESLint (flat config)
        run: npm run lint

      - name: Vitest (env/api/flyer)
        run: npm test

      - name: Contrato del Studio
        run: npm run verify:studio

      - name: Build de producción
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  # ---------------------------------------------------------------------------
  security:
    name: Bandit + pip-audit + Trivy (fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks necesita leer los PRs para comentar el hallazgo; el resto solo
    # el contenido. El default del workflow (contents: read) ya no alcanza.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bandit (SAST del código Python, severidad media+)
        run: |
          pip install bandit==1.9.4
          bandit -r AdminApp StoreApp SuscriptionApp DaventProject -ll

      - name: pip-audit — CVEs en dependencias Python
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: npm audit — CVEs en dependencias del SPA (prod)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Gitleaks — secretos filtrados en el repo
        # v3 = runtime node24: GitHub retiró node20 de los runners el
        # 2026-09-16, así que `@v2` ya no arranca y tumbaba este job (y con él
        # build -> deploy). No cambian inputs ni comportamiento.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — vulnerabilidades en dependencias/archivos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: venv,frontend/node_modules,.git

  # ---------------------------------------------------------------------------
  build:
    name: Build + push imágenes + Trivy (image)
    runs-on: ubuntu-latest
    # `security` también gatea: sin esto la imagen se publicaba en GHCR
    # mientras el SAST/audit todavía corrían.
    needs: [lint, test, security, frontend]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write          # firma keyless (cosign/OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Trivy — misconfig de Dockerfile/compose
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags imagen API (sha-<commit> siempre, +latest solo en main)
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tags imagen WEB
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # En PR no se pushea ni se escanea (los Trivy tienen if != pull_request):
      # `load: true` exportaba 800MB-1.5GB al daemon para nada.
      - name: Build API -> GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build WEB -> GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          sbom: true
          provenance: true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_PLATFORM_DOMAIN=${{ vars.PLATFORM_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Instalar cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Firmar imágenes (keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${{ env.API_IMAGE }}:sha-${{ github.sha }}"
          cosign sign --yes "${{ env.WEB_IMAGE }}:sha-${{ github.sha }}"

      - name: Trivy — scan de la imagen API publicada
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — scan de la imagen WEB publicada
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy al VPS (SSH)
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 15
    # El `concurrency` del workflow cancela a mitad de camino: si un push
    # llega durante el deploy, abortaría entre `pull` y `up -d` dejando el
    # host con migraciones nuevas y contenedores viejos. Los deploys se
    # serializan, nunca se cancelan.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # El secreto se materializa desde el env del step (no se interpola en el
      # script: no aparece en argv ni en los logs) y viaja por scp.
      - name: Materializar secretos de webhook (0600, efímero)
        env:
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          SECRET_MP_KEY: ${{ secrets.SECRET_MP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'MP_WEBHOOK_SECRET=%s\n' "$MP_WEBHOOK_SECRET"
            printf 'SECRET_MP_KEY=%s\n' "$SECRET_MP_KEY"
          } > davent-secrets.env

      - name: Subir secretos al VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: davent-secrets.env
          target: /opt/davent/.secrets
          overwrite: true

      # El archivo de secretos no queda en el workspace del runner: se borra
      # apenas termina el scp (siempre, incluso si el upload falla).
      - name: Borrar secretos del runner
        if: always()
        run: rm -f davent-secrets.env

      - name: SSH -> secretos + pull imágenes + migrate + up rolling
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/davent

            # 0. Sin PLATFORM_DOMAIN el curl final apunta a "https:///healthz/"
            #    y el job muere con un error críptico DESPUÉS de haber
            #    reemplazado los contenedores. Se valida antes de tocar nada.
            [ -n "${{ vars.PLATFORM_DOMAIN }}" ] || { echo "FATAL: la variable PLATFORM_DOMAIN no está definida en el repo"; exit 1; }

            # 1. Merge atómico de SOLO las claves que administra CI (el resto
            #    del .env se respeta byte a byte).
            umask 077
            tmp=$(mktemp .env.XXXXXX)
            grep -v -E '^(MP_WEBHOOK_SECRET|SECRET_MP_KEY)=' .env > "$tmp" || true
            cat .secrets/davent-secrets.env >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env
            shred -u .secrets/davent-secrets.env 2>/dev/null || rm -f .secrets/davent-secrets.env

            # 2. Preflight fail-closed: sin firma HMAC válida los pagos quedan
            #    en 401 silencioso (check --deploy solo corre en el job test).
            grep -q '^MP_WEBHOOK_SECRET=.\{32,\}' .env || { echo "FATAL: MP_WEBHOOK_SECRET ausente o <32 chars"; exit 1; }
            grep -q '^SECRET_MP_KEY=.\{16,\}' .env     || { echo "FATAL: SECRET_MP_KEY ausente"; exit 1; }
            grep -q '^SECRET_KEY=.\{32,\}' .env        || { echo "FATAL: SECRET_KEY ausente o <32 chars"; exit 1; }
            # 2b. DEBUG=True en producción expone trazas, settings y SQL.
            #     `check --deploy` NO corre al arrancar el contenedor: este es
            #     el único gate que lo mira en el .env real del VPS.
            if grep -q '^DEBUG=True' .env; then echo "FATAL: DEBUG=True en el .env de producción"; exit 1; fi
            # 2c. ADMIN_URL no predecible (mismo criterio que users.E001): con
            #     el default 'admin/' el panel queda a un escaneo de distancia.
            ADMIN_PATH=$(grep '^ADMIN_URL=' .env | cut -d= -f2- | tr -d '\r')
            [ -n "$ADMIN_PATH" ] || { echo "FATAL: ADMIN_URL ausente (users.E001)"; exit 1; }
            case "$ADMIN_PATH" in
              admin|admin/) echo "FATAL: ADMIN_URL no puede ser 'admin/' (users.E001)"; exit 1 ;;
            esac
            # Keyring de PII: SIN esto el contenedor arranca cifrando
            # document/phone/nombres con la llave derivada del SECRET_KEY
            # (kid "self"). Al definir el keyring real después, _keyring() deja
            # de exponer "self" y esas filas quedan ILEGIBLES (VaultError en
            # cada lectura) — no es solo "acoplado al SECRET_KEY", es pérdida.
            # El keyring no lo inyecta CI (se rota a mano): solo se valida.
            grep -q '^SECRETS_MASTER_KEYS=.\{20,\}' .env || { echo "FATAL: SECRETS_MASTER_KEYS ausente — la PII se cifraría con la llave derivada y quedaría ilegible al definir el keyring"; exit 1; }
            grep -q '^SECRETS_HASH_KEY=.\{20,\}' .env    || { echo "FATAL: SECRETS_HASH_KEY ausente (huellas de documento/celular)"; exit 1; }

            # 2d. Tags previos ANTES de tocar nada: si el healthcheck falla,
            #     el rollback vuelve a estas imágenes (nunca a :latest).
            PREV_API_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q api)" 2>/dev/null || true)
            PREV_WEB_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q web)" 2>/dev/null || true)
            echo "Imágenes previas: api=${PREV_API_IMAGE:-<ninguna>} web=${PREV_WEB_IMAGE:-<ninguna>}"

            # 3. Rotación por sha (nunca :latest).
            git pull --ff-only
            export API_IMAGE=${{ env.API_IMAGE }}:sha-${{ github.sha }}
            export WEB_IMAGE=${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
            docker compose pull

            # 3b. Backup de Postgres a R2 ANTES de migrar (fail-closed): una
            #     migración destructiva o fallida no tiene otra red.
            docker compose run --rm api python manage.py backup_db
            docker compose run --rm migrate

            # 4/5. Rolling + verificación externa con rollback: si `up -d
            # --wait` o el healthz fallan, se re-despliegan las imágenes
            # previas y el job termina en rojo indicando el sha.
            rollback() {
              echo "FATAL: el deploy de ${{ github.sha }} no quedó sano; rollback a api=${PREV_API_IMAGE:-<sin imagen previa>} web=${PREV_WEB_IMAGE:-<sin imagen previa>}"
              [ -n "${PREV_API_IMAGE:-}" ] && export API_IMAGE="$PREV_API_IMAGE"
              [ -n "${PREV_WEB_IMAGE:-}" ] && export WEB_IMAGE="$PREV_WEB_IMAGE"
              docker compose up -d --remove-orphans --wait --wait-timeout 180 || true
              curl -fsS --retry 5 --retry-delay 3 -o /dev/null "https://${{ vars.PLATFORM_DOMAIN }}/healthz/" || true
              exit 1
            }
            if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
              rollback
            fi
            if ! curl -fsS --retry 5 --retry-delay 3 -o /dev/null "https://${{ vars.PLATFORM_DOMAIN }}/healthz/"; then
              rollback
            fi
            # 5b. GC de imágenes viejas (los tags sha-<commit> se acumulaban
            #     hasta llenar el disco).
            docker image prune -f --filter "until=168h"
