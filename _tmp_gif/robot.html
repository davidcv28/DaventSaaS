<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:800px;height:640px;background:transparent;overflow:hidden}
body{position:relative;font-family:'Segoe UI',system-ui,sans-serif}
.robot{position:absolute;left:-140px;top:0;width:640px;height:640px;will-change:transform}

/* arms */
.arm{position:absolute;width:20px;height:96px;transform-origin:50% 8px;will-change:transform;z-index:1}
.arm .stick{position:absolute;inset:0;border-radius:10px;background:linear-gradient(165deg,#8b5cf6 0%,#6d28d9 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -10px 16px rgba(76,29,149,.32)}
.arm .hand{position:absolute;left:50%;bottom:-10px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#c4b5fd,#8b5cf6 62%,#6d28d9);box-shadow:0 5px 12px rgba(76,29,149,.35),inset 0 -4px 7px rgba(76,29,149,.35)}
.arm .hand::after{content:"";position:absolute;left:8px;top:7px;width:10px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(-20deg)}
#armL{left:232px;top:330px}
#armR{left:388px;top:330px}

/* antenna */
.antenna{position:absolute;left:314px;top:240px;width:12px;height:54px;z-index:1}
.antenna .stem{position:absolute;left:4px;top:16px;width:4px;height:34px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#6d28d9)}
.antenna .orb{position:absolute;left:-4px;top:-8px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ede9fe,#a78bfa 55%,#7c3aed);box-shadow:0 0 16px 5px rgba(167,139,250,.55)}

/* body */
.body{position:absolute;left:245px;top:288px;width:150px;height:216px;border-radius:44px;z-index:2;background:linear-gradient(165deg,#b79bff 0%,#8b5cf6 42%,#6d28d9 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -18px 32px rgba(76,29,149,.30),0 18px 36px rgba(91,33,182,.20)}
.body::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(112deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.05) 30%,transparent 48%)}

/* visor */
.visor{position:absolute;left:24px;top:34px;width:102px;height:60px;border-radius:20px;background:linear-gradient(180deg,#27324e 0%,#0f172a 78%);box-shadow:inset 0 3px 10px rgba(2,6,23,.6),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.16)}
.visor::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:15px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent)}
.eye{position:absolute;top:17px;width:24px;height:28px;border-radius:9px;background:linear-gradient(180deg,#ffffff 0%,#dbeafe 100%);box-shadow:0 0 14px 3px rgba(191,219,254,.85),0 0 30px 9px rgba(147,197,253,.32);transform-origin:50% 50%;will-change:transform}
#eyeL{left:17px}
#eyeR{left:61px}
.mouth{position:absolute;left:36px;top:50px;width:30px;height:6px;border-radius:3px;background:rgba(226,232,240,.75)}

/* chest panel */
.panel{position:absolute;left:24px;top:130px;width:102px;height:54px;border-radius:15px;background:rgba(15,23,42,.32);box-shadow:inset 0 2px 8px rgba(2,6,23,.45),inset 0 -1px 0 rgba(255,255,255,.10),0 1px 0 rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.08)}
.led{position:absolute;top:21px;width:11px;height:11px;border-radius:50%}
#led1{left:24.5px;background:#34d399;box-shadow:0 0 10px 2px rgba(52,211,153,.7)}
#led2{left:45.5px;background:#fbbf24;box-shadow:0 0 10px 2px rgba(251,191,36,.7)}
#led3{left:66.5px;background:#818cf8;box-shadow:0 0 10px 2px rgba(129,140,248,.7)}

/* hover dots */
.dot{position:absolute;left:50%;height:4px;border-radius:2px;background:#cbd5e1;will-change:opacity}
#d1{top:556px;width:56px;margin-left:-28px}
#d2{top:574px;width:38px;margin-left:-19px}
#d3{top:592px;width:22px;margin-left:-11px}

/* sparkles */
.spark{position:absolute;width:14px;height:14px;will-change:opacity}
.spark::before,.spark::after{content:"";position:absolute;background:#c4b5fd;border-radius:2px}
.spark::before{left:6px;top:0;width:2px;height:14px}
.spark::after{left:0;top:6px;width:14px;height:2px}
#s1{left:436px;top:216px}
#s2{left:168px;top:318px;transform:rotate(25deg)}

/* speech bubble */
.bubble{position:absolute;left:372px;top:104px;width:392px;padding:20px 22px 18px;border-radius:24px;background:#fff;box-shadow:0 18px 44px rgba(9,11,30,.45),0 3px 10px rgba(9,11,30,.25);transform-origin:26px 100%;will-change:transform,opacity;opacity:0}
.bubble::after{content:"";position:absolute;left:34px;bottom:-11px;width:24px;height:24px;background:#fff;border-radius:0 0 0 7px;transform:rotate(-45deg) skewX(-18deg);box-shadow:-6px 8px 14px rgba(9,11,30,.18)}
.b-l1{font-size:23px;font-weight:700;color:#1e1b4b;min-height:30px;line-height:30px;letter-spacing:-.01em;white-space:nowrap}
.b-l2{margin-top:8px;font-size:18px;font-weight:500;color:#475169;line-height:25px;min-height:50px}
.caret{display:inline-block;width:2.5px;height:1.05em;margin-left:2px;border-radius:2px;background:#7c3aed;vertical-align:-0.15em}
.chip{display:inline-grid;place-items:center;width:32px;height:32px;margin-left:7px;border-radius:11px;vertical-align:-9px;background:linear-gradient(135deg,#818cf8,#6d28d9);box-shadow:0 5px 14px rgba(109,40,217,.45);will-change:transform,opacity}
.chip .cb{position:relative;width:15px;height:12px;border-radius:5px;background:#fff}
.chip .cb::after{content:"";position:absolute;left:3px;bottom:-4px;width:7px;height:7px;background:#fff;border-radius:0 0 0 3px;transform:rotate(-38deg) skewX(-18deg)}
.chip .cb i{position:absolute;top:5px;width:2.6px;height:2.6px;border-radius:50%;background:#6d28d9}
.chip .cb i:nth-child(1){left:2.5px}.chip .cb i:nth-child(2){left:6.2px}.chip .cb i:nth-child(3){left:9.9px}
</style></head><body>
<div class="robot" id="robot">
  <div class="arm" id="armL"><div class="stick"></div><div class="hand"></div></div>
  <div class="arm" id="armR"><div class="stick"></div><div class="hand"></div></div>
  <div class="antenna"><div class="stem"></div><div class="orb" id="orb"></div></div>
  <div class="body">
    <div class="visor"><div class="eye" id="eyeL"></div><div class="eye" id="eyeR"></div><div class="mouth"></div></div>
    <div class="panel"><div class="led" id="led1"></div><div class="led" id="led2"></div><div class="led" id="led3"></div></div>
  </div>
  <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  <div class="spark" id="s1"></div><div class="spark" id="s2"></div>
</div>
<div class="bubble" id="bubble">
  <div class="b-l1"><span id="t1"></span><span class="caret" id="c1"></span></div>
  <div class="b-l2"><span id="t2"></span><span class="caret" id="c2"></span><span class="chip" id="chip"><span class="cb"><i></i><i></i><i></i></span></span></div>
</div>
<script>
const N=165;
const L1='¡Hola! Bienvenido a Davent \u{1F44B}';
const L2='Cualquier duda, escribime desde la burbujita de chat';
const robot=document.getElementById('robot'),armR=document.getElementById('armR'),
armL=document.getElementById('armL'),orb=document.getElementById('orb'),
eyes=[document.getElementById('eyeL'),document.getElementById('eyeR')],
dots=[document.getElementById('d1'),document.getElementById('d2'),document.getElementById('d3')],
sparks=[document.getElementById('s1'),document.getElementById('s2')],
bubble=document.getElementById('bubble'),
t1=document.getElementById('t1'),t2=document.getElementById('t2'),
c1=document.getElementById('c1'),c2=document.getElementById('c2'),
chip=document.getElementById('chip');
const chars=s=>[...s];
const c1s=chars(L1),c2s=chars(L2);
const back=x=>{const s=1.9,u=x-1;return 1+(s+1)*u*u*u+s*u*u};
function pose(i){
  const t=i/N,w=Math.PI*2;
  robot.style.transform=`translateY(${(5*Math.sin(w*t)).toFixed(2)}px) rotate(${(1.1*Math.sin(w*t+0.6)).toFixed(2)}deg)`;
  armR.style.transform=`rotate(${(-105+30*Math.sin(w*t)).toFixed(2)}deg)`;
  armL.style.transform=`rotate(${(15+5*Math.sin(w*t+1.3)).toFixed(2)}deg)`;
  const m=i%60,blink=(m>=22&&m<=26)||(m>=52&&m<=56);
  eyes.forEach(e=>e.style.transform=`scaleY(${blink?0.12:1})`);
  const g=0.45+0.2*Math.sin(w*t*2);
  orb.style.boxShadow=`0 0 ${18+8*Math.sin(w*t*2)}px ${4+2*Math.sin(w*t*2)}px rgba(167,139,250,${g.toFixed(2)})`;
  dots.forEach((d,k)=>d.style.opacity=(0.3+0.35*Math.sin(w*t-k*0.9)).toFixed(2));
  sparks.forEach((s,k)=>s.style.opacity=(0.2+0.6*Math.abs(Math.sin(w*t*1.5+k*2))).toFixed(2));

  // bubble timeline
  let bs=0,bo=0;
  if(i>=14&&i<30){const x=(i-14)/16;bs=back(Math.min(x,1));bo=Math.min(1,x*3)}
  else if(i>=30&&i<156){bs=1;bo=1}
  else if(i>=156){const x=(i-156)/9;bs=1-0.2*x;bo=1-x}
  bubble.style.opacity=bo.toFixed(2);
  bubble.style.transform=`scale(${(0.55+0.45*bs).toFixed(3)}) translateY(${((1-bs)*14).toFixed(1)}px)`;

  // typing
  const n1=Math.max(0,Math.min(c1s.length,Math.floor((i-30)*1.1)));
  const n2=Math.max(0,Math.min(c2s.length,Math.floor((i-72)*1.1)));
  t1.textContent=c1s.slice(0,n1).join('');
  t2.textContent=c2s.slice(0,n2).join('');
  const typing1=n1>0&&n1<c1s.length,typing2=n2>0&&n2<c2s.length;
  const hold=i>=126&&i<156,cBlink=Math.floor(i/4)%2===0;
  c1.style.opacity=(typing1||(i>=30&&i<72&&n1>0))?1:0;
  c2.style.opacity=(typing2||(hold&&cBlink&&n2===c2s.length))?1:0;

  // chip pop + pulse
  let cs=0;
  if(i>=124){const x=Math.min(1,(i-124)/8);cs=back(x)}
  if(i>=132&&i<156)cs=1+0.09*Math.sin((i-132)/24*Math.PI*2);
  if(i>=156)cs=Math.max(0,1-(i-156)/9);
  chip.style.opacity=Math.min(1,cs).toFixed(2);
  chip.style.transform=`scale(${Math.max(0,cs).toFixed(3)})`;
}
</script></body></html>
