<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>davent — ad v2</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
import { DUR, NAR, LOGO_HIT, CARD_IN, SHOTS } from './timeline.js';
import { seg, lerp, ease, glide, snap, spring, springTo, pulse, stageSize, setupCanvas, camera, mix, rgba, loadFonts, loadImage } from './motion.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

const C = { bg: '#070917', card: '#10132b', ink: '#eef0ff', ink2: '#9aa0c8', accent: '#7b6cf6', accent2: '#a78bfa', line: '#262b52' };
const SANS = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
const F = (s, w = 400) => `${w} ${s}px ${SANS}`;

const imgs = await Promise.all(['inicio', 'productos', 'diseno', 'landing'].map(n => loadImage(`assets/${n}.png`)));
const [IMG_INICIO, IMG_PRODUCTOS, IMG_DISENO, IMG_LANDING] = imgs;

// shot list: [img, t0, t1, label, panFrom, panTo] — pan in image-cover space [-1..1]
const SHOTS2 = [
  { img: IMG_INICIO,    t0: 0,     t1: 3.15,  label: '',          pan: [0.0, -0.25], enter: true },
  { img: IMG_PRODUCTOS, t0: 2.851, t1: 4.35,  label: 'PRODUCTOS', pan: [-0.15, 0.15] },
  { img: IMG_DISENO,    t0: 4.35,  t1: 5.55,  label: 'DISEÑO',    pan: [0.15, -0.15] },
  { img: IMG_LANDING,   t0: 5.55,  t1: 7.6,   label: 'TU WEB',    pan: [-0.2, 0.0] },
];
const XF = 0.34; // crossfade duration

window.DUR = DUR;
window.render = t => {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  glow();

  // current + incoming shot during crossfades
  for (let i = 0; i < SHOTS2.length; i++) {
    const s = SHOTS2[i];
    if (t < s.t0 - (i ? XF : 0) || t > s.t1) continue;
    drawShot(s, t, i === 0 ? spring(t - s.t0, { freq: 2.4, damp: 0.8 }) : ease.outCubic(seg(t, s.t0 - XF, s.t0)));
  }

  featureLabel(t);
  logoWash(t);
  endCard(t);
};

function drawShot(s, t, inK) {
  if (inK <= 0) return;
  const local = seg(t, s.t0, s.t1);
  const fw = W * 0.84, fh = fw * (s.img.height / s.img.width);
  const fhMax = H * 0.78, scale = Math.min(1, fhMax / fh), ww = fw * scale, hh = fh * scale;
  const cx = W / 2, cy = H / 2 - 12 * U;

  // slow push-in + pan
  const push = lerp(1.0, 1.06, ease.inOutCubic(local)) * lerp(0.94, 1, inK);
  const px = lerp(s.pan[0], s.pan[1], local) * s.img.width * 0.04;

  ctx.save();
  ctx.globalAlpha = inK;
  // shadow
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 60 * U; ctx.shadowOffsetY = 24 * U;
  ctx.fillStyle = C.card;
  ctx.beginPath(); ctx.roundRect(cx - ww / 2, cy - hh / 2, ww, hh, 22 * U); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  // clipped image
  ctx.save();
  ctx.beginPath(); ctx.roundRect(cx - ww / 2, cy - hh / 2, ww, hh, 22 * U); ctx.clip();
  const cover = Math.max(ww / s.img.width, hh / s.img.height) * push;
  ctx.drawImage(s.img, cx - s.img.width * cover / 2 - px * cover, cy - s.img.height * cover / 2, s.img.width * cover, s.img.height * cover);
  ctx.restore();
  ctx.beginPath(); ctx.roundRect(cx - ww / 2, cy - hh / 2, ww, hh, 22 * U); ctx.strokeStyle = rgba(C.accent, .28); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

const FEATURES = [
  { t: 3.1, label: 'PRODUCTOS' },
  { t: 4.35, label: 'DISEÑO' },
  { t: 5.55, label: 'TU WEB' },
];
function featureIdx(t) { let k = -1; FEATURES.forEach((f, i) => { if (t >= f.t) k = i; }); return k; }

function featureLabel(t) {
  const i = featureIdx(t);
  if (i < 0 || t >= NAR.s3[0] + 0.4) return;
  const f = FEATURES[i];
  const k = spring(t - f.t, { freq: 3, damp: 0.7 });
  const out = 1 - ease.inCubic(seg(t, f.t + 1.0, f.t + 1.2));
  ctx.save(); ctx.globalAlpha = Math.min(k, out);
  ctx.font = F(58 * U, 800); ctx.textAlign = 'center';
  ctx.fillStyle = C.ink; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20 * U;
  ctx.fillText(f.label, W / 2, H - 84 * U + (1 - k) * 36 * U);
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.accent;
  ctx.beginPath(); ctx.roundRect(W / 2 - 56 * U * k, H - 60 * U, 112 * U * k, 6 * U, 3 * U); ctx.fill();
  ctx.restore();
}

// wash to brand bg as the dashboard leaves
function logoWash(t) {
  const inK = ease.outCubic(seg(t, NAR.s3[0], LOGO_HIT + 0.15));
  if (inK <= 0) return;
  ctx.fillStyle = C.bg; ctx.globalAlpha = inK; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.globalAlpha = inK; glow(); ctx.globalAlpha = 1;
  const g0 = ctx.createRadialGradient(W / 2, H / 2 - 40 * U, 0, W / 2, H / 2 - 40 * U, H * 0.55);
  g0.addColorStop(0, rgba(C.accent, .10)); g0.addColorStop(1, rgba(C.accent, 0));
  ctx.fillStyle = g0; ctx.globalAlpha = inK; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;

  const k = spring(t - LOGO_HIT, { freq: 2.6, damp: 0.68 });
  const cx = W / 2, cy = H / 2 - 40 * U;
  ctx.save(); ctx.globalAlpha = Math.min(1, k);
  // logo mark: violet rounded square + D
  const m = 92 * U * (0.6 + 0.4 * k);
  const g = ctx.createLinearGradient(cx - m, cy - m, cx + m, cy + m);
  g.addColorStop(0, C.accent); g.addColorStop(1, '#5b4bd6');
  ctx.beginPath(); ctx.roundRect(cx - m / 2 - 150 * U * 0 - m * 1.55, cy - m / 2, m, m, m * 0.28); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = F(m * 0.5, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('D', cx - m * 1.05, cy + m * 0.05);
  ctx.fillStyle = C.ink; ctx.font = F(120 * U, 800); ctx.textAlign = 'left';
  ctx.fillText('DAVENT', cx - m * 0.75, cy + 6 * U);
  ctx.restore();
}

function endCard(t) {
  const t2 = spring(t - CARD_IN, { freq: 2.8, damp: 0.75 });
  if (t2 <= 0) return;
  const cx = W / 2, cy = H / 2 - 40 * U;
  ctx.save(); ctx.globalAlpha = Math.min(1, t2);
  ctx.font = F(42 * U, 500); ctx.textAlign = 'center';
  ctx.fillStyle = C.ink2; ctx.fillText('Publicá hoy.', cx, cy + 110 * U);
  const pulseK = 1 + 0.035 * Math.sin(t * 3) * seg(t, 10.5, 11.2);
  ctx.save(); ctx.translate(cx, cy + 205 * U); ctx.scale(pulseK, pulseK);
  const g = ctx.createLinearGradient(-180 * U, 0, 180 * U, 0);
  g.addColorStop(0, C.accent); g.addColorStop(1, '#5b4bd6');
  ctx.beginPath(); ctx.roundRect(-185 * U, -36 * U, 370 * U, 72 * U, 36 * U); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = F(28 * U, 700); ctx.textBaseline = 'middle';
  ctx.fillText('Crear cuenta gratis', 0, 2 * U);
  ctx.restore();
  ctx.restore();
}

function glow() {
  const g = ctx.createRadialGradient(W * 0.75, H * 0.2, 0, W * 0.75, H * 0.2, H * 0.9);
  g.addColorStop(0, rgba(C.accent, .14)); g.addColorStop(1, rgba(C.accent, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W * 0.15, H * 0.9, 0, W * 0.15, H * 0.9, H * 0.8);
  g2.addColorStop(0, rgba('#3b2f8f', .18)); g2.addColorStop(1, rgba('#3b2f8f', 0));
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}

await loadFonts([]);
window.render(0);
window.READY = true;
</script>
</body>
</html>
